const noteTranslations={'2 концерта':'2 shows'};
const originalMonthTotals={'2026-11':{theatre:20,tours:12,events:0}};
const params=new URLSearchParams(location.search);
let lang=params.get('lang')==='en'?'en':'ru';
const requestedMonth=params.get('month');
const todayStr=moscowToday();
let selectedMonth=monthsFound.includes(requestedMonth)?requestedMonth:(monthsFound.includes(todayStr.slice(0,7))?todayStr.slice(0,7):monthsFound.find(x=>x>=todayStr.slice(0,7))||monthsFound[0]);
let lastRenderedMoscowDate=todayStr;
const plural=n=>{const x=Math.abs(n);return x%10===1&&x%100!==11?'событие':x%10>=2&&x%10<=4&&(x%100<12||x%100>14)?'события':'событий'};
const make=(tag,cls,txt)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el};
const monthLabel=key=>{const s=new Intl.DateTimeFormat(lang==='ru'?'ru-RU':'en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(key+'-01T12:00:00Z'));return s[0].toUpperCase()+s.slice(1)};
const weekday=date=>new Intl.DateTimeFormat(lang==='ru'?'ru-RU':'en-US',{weekday:'long',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));
const eventWord=n=>lang==='ru'?plural(n):labels.en.events;
const translate=value=>lang==='en'?(translations[value]||value):value;
const translateNote=value=>lang==='en'?(noteTranslations[value]||value):value;
function updateURL(){const u=new URL(location.href);u.searchParams.set('month',selectedMonth);if(lang==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u)}
function render(){
 const currentDay=moscowToday();lastRenderedMoscowDate=currentDay;
 const text=labels[lang];
 document.documentElement.lang=lang;
 document.title=lang==='ru'?'Сводная таблица мероприятий TODES — TODESPRODUCTION':'TODES Event Calendar — TODESPRODUCTION';
 document.getElementById('homeLink').textContent=text.home;
 document.querySelector('.footer-caption').textContent=text.footer;
 document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)));
 const subset=items.filter(x=>x.date.startsWith(selectedMonth));
 const rawCounts={theatre:0,tours:0,events:0};
 for(const e of subset)rawCounts[e.category]++;
 const baseline=originalMonthTotals[selectedMonth]||{};
 const counts={theatre:Math.max(rawCounts.theatre,baseline.theatre||0),tours:Math.max(rawCounts.tours,baseline.tours||0),events:Math.max(rawCounts.events,baseline.events||0)};
 const total=counts.theatre+counts.tours+counts.events;
 const root=document.getElementById('timeline');root.replaceChildren();
 const section=make('section','month'),calendar=make('div','calendar'),hdr=make('div','grid-head');
 const monthCell=make('div','cell-head cell-head-month');
 const select=make('select','month-picker');select.id='month-select';select.setAttribute('aria-label',text.month);
 for(const month of monthsFound){const option=make('option','',monthLabel(month));option.value=month;select.append(option)}
 select.value=selectedMonth;
 select.addEventListener('change',()=>{selectedMonth=select.value;updateURL();render()});
 monthCell.append(select,make('div','month-count-lite',total+' '+eventWord(total)));hdr.append(monthCell);
 for(const cat of categories){
  const head=make('div','cell-head head-'+cat);
  head.append(make('span','head-label',text[cat==='events'?'other':cat]),make('span','head-count',counts[cat]+' '+eventWord(counts[cat])));
  hdr.append(head);
 }
 calendar.append(hdr);
 const grouped=new Map();
 for(const e of subset){if(!grouped.has(e.date))grouped.set(e.date,{theatre:[],tours:[],events:[]});grouped.get(e.date)[e.category].push(e)}
 const [year,month]=selectedMonth.split('-').map(Number);
 const days=new Date(Date.UTC(year,month,0)).getUTCDate();
 for(let n=1;n<=days;n++){
  const date=selectedMonth+'-'+String(n).padStart(2,'0');
  const dayOfWeek=new Date(date+'T12:00:00Z').getUTCDay();
  const isToday=date===currentDay;
  const day=make('article','day'+(isToday?' today':''));day.dataset.date=date;
  if(isToday)day.setAttribute('aria-current','date');
  const dateCell=make('div','date-cell'+(dayOfWeek===0||dayOfWeek===6?' weekend':''));
  dateCell.append(make('span','date-number',String(n)),make('span','weekday',weekday(date)));
  if(isToday)dateCell.append(make('span','today-tag',text.today));
  day.append(dateCell);
  for(const cat of categories){
   const col=make('div','entry-col');
   const records=(grouped.get(date)||{theatre:[],tours:[],events:[]})[cat];
   if(!records.length)col.append(make('span','empty',text.empty));
   for(const e of records){
    const entry=make('div','entry '+cat),line=make('div','entry-line');
    line.append(make('span','entry-title',translate(e.title)));
    if(e.time)line.append(make('span','time',e.time));
    entry.append(line);
    if(e.note)entry.append(make('div','note',translateNote(e.note)));
    col.append(entry);
   }
   day.append(col);
  }
  calendar.append(day);
 }
 section.append(calendar);root.append(section);
}
function refreshAtMoscowMidnight(){
 const now=new Date();
 const clock=Object.fromEntries(clockFormatter.formatToParts(now).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));
 const elapsed=((clock.hour*60+clock.minute)*60+clock.second)*1000+now.getMilliseconds();
 setTimeout(()=>{if(moscowToday()!==lastRenderedMoscowDate)render();refreshAtMoscowMidnight()},86400000-elapsed+100);
}
function refreshIfDayChanged(){if(moscowToday()!==lastRenderedMoscowDate)render()}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{lang=button.dataset.lang;updateURL();render()}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshIfDayChanged()});
window.addEventListener('pageshow',refreshIfDayChanged);
render();refreshAtMoscowMidnight();
})();
</script>
</body></html>
