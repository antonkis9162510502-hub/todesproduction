function render(lang) {
  const en = lang === 'en';
  document.documentElement.lang = lang;
  const title = en ? 'Theatre' : 'Театр';
  document.querySelector('h1').textContent = title;
  document.title = title + ' — TODESPRODUCTION';
  const home = document.querySelector('#home');
  home.href = 'index.html?lang=' + lang;
  home.textContent = en ? '← Home' : '← На главную';
  document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', button.dataset.lang === lang));
  const schedule = document.querySelector('#schedule');
  schedule.replaceChildren();
  const today = new Intl.DateTimeFormat('sv-SE', { timeZone:'Europe/Moscow' }).format(new Date());
  let month, list;
  for (const event of performances.filter(row => row.date >= today)) {
    const date = new Date(event.date + 'T12:00:00Z');
    const format = options => date.toLocaleDateString(en ? 'en-GB' : 'ru-RU', {...options,timeZone:'UTC'});
    if (month !== event.date.slice(0,7)) {
      month = event.date.slice(0,7);
      const section = document.createElement('section');
      section.className = 'month';
      const heading = document.createElement('h2');
      heading.textContent = format({month:'long',year:'numeric'});
      list = document.createElement('ul');
      section.append(heading,list);
      schedule.append(section);
    }
    const [ru, english, hash] = shows[event.i];
    const item = document.createElement('li');
    const when = document.createElement('time');
    when.dateTime = event.date;
    when.textContent = format({day:'numeric',weekday:'short'});
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.src = 'https://media.ticketland.ru/images/420x270/' + hash.slice(0,2) + '/' + hash.slice(2,4) + '/' + hash + '.jpg';
    const details = document.createElement('div');
    const name = document.createElement('strong');
    name.textContent = en ? english : ru;
    details.append(name);
    if (event.time || event.count > 1) {
      const info = document.createElement('small');
      info.textContent = event.time || (event.count + (en ? ' performances' : ' показа'));
      details.append(info);
    }
    item.append(when,img,details);
    list.append(item);
  }
  if (!list) schedule.textContent = en ? 'New dates will appear here.' : 'Здесь появятся новые даты.';
}
document.querySelectorAll('[data-lang]').forEach(button => button.onclick = () => {
  const lang = button.dataset.lang;
  history.replaceState(null,'','?lang=' + lang);
  render(lang);
});
