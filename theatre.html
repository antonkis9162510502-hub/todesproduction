  const schedule = document.querySelector('#schedule');
  schedule.replaceChildren();
  const today = moscowDate.format(new Date());
  const nextMidnight = Date.parse(today + 'T00:00:00+03:00') + 86400000;
  clearTimeout(midnightTimer);
  midnightTimer = setTimeout(refreshSchedule, Math.max(0, nextMidnight - Date.now()));
  let month, list, previousDate = null;
  for (const event of performances.filter(row => row.date >= today)) {
    const date = new Date(event.date + 'T12:00:00Z');
    const format = options => date.toLocaleDateString(en ? 'en-GB' : 'ru-RU', {...options,timeZone:'UTC'});
    if (month !== event.date.slice(0,7)) {
      month = event.date.slice(0,7);
      const section = document.createElement('section');
      section.className = 'month';
      const heading = document.createElement('h2');
      heading.textContent = format({month:'long',year:'numeric'});
      list = document.createElement('ul');
      section.append(heading,list);
      schedule.append(section);
    }
    const [ru, english, poster] = shows[event.i];
    const item = document.createElement('li');
    const when = document.createElement('time');
    when.dateTime = event.date;
     if ([0,6].includes(date.getUTCDay())) when.classList.add('weekend');
    const firstOfDate = event.date !== previousDate;
     when.textContent = firstOfDate ? format({day:'numeric',weekday:'short'}) : '';
     if (!firstOfDate) when.setAttribute('aria-label', en ? 'Same date as above' : 'Та же дата, что выше');
     previousDate = event.date;
    item.append(when);
    if (poster) {
      const img = document.createElement('img');
      img.alt = '';
      img.width = 210;
      img.height = 135;
      img.src = poster;
      item.append(img);
    }
    const details = document.createElement('div');
    const name = document.createElement('strong');
    name.textContent = en ? english : ru;
    details.append(name);
    {
      const info = document.createElement('small');
      info.textContent = event.time || (en ? 'Time to be confirmed' : 'Время уточняется');
      details.append(info);
    }
    if (!poster) details.style.gridColumn = '2 / -1';
    item.append(details);
    list.append(item);
  }
  if (!list) schedule.textContent = en ? 'New dates will appear here.' : 'Здесь появятся новые даты.';
}
document.querySelectorAll('[data-lang]').forEach(button => button.onclick = () => {
  const lang = button.dataset.lang;
  history.replaceState(null,'','?lang=' + lang);
  render(lang);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshSchedule();
});
window.addEventListener('pageshow', refreshSchedule);
render(new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ru');
</script></body></html>
