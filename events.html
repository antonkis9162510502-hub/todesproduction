const logos={moscow:0,voronezh:1,spb:2,kazan:3,nnov:4,todes:5};
const genericNames={
fest:["TODES","ФЕСТ"],battle:["DANCE","BATTLE"],intensive:["TODES","INTENSIVE"],
master:["DANCE","CLASS"],speak:["#ВЫСКАЖИСЬ","ФЕСТИВАЛЬ"],choreo:["Я —","ХОРЕОГРАФ"],
ladies:["TODES","LADY'S"]
};
const dateClock=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"});
let midnightTimer;
function dateObj(s){return new Date(s+"T12:00:00Z")}
function textDate(d,lang,options){return dateObj(d).toLocaleDateString(lang==="en"?"en-GB":"ru-RU",{...options,timeZone:"UTC"})}
function dateLabel(e,lang){
 const start=e[0],end=e[1],uncertain=e[9];
 if(uncertain)return lang==="en"?"27 or 28 Mar":"27 или 28 мар";
 const startLabel=textDate(start,lang,{day:"numeric",weekday:"short"});
 if(!end)return startLabel;
 const endLabel=textDate(end,lang,{day:"numeric",weekday:"short"});
 if(start.slice(0,7)===end.slice(0,7))return startLabel+" – "+endLabel;
 return textDate(start,lang,{day:"numeric",month:"short"})+" – "+textDate(end,lang,{day:"numeric",month:"short"});
}
function thumbnail(e){
 const kind=e[4],logo=e[5],box=document.createElement("div");box.className="thumb";box.dataset.type=kind;
 if(kind==="studio"){
  const img=document.createElement("img");img.src=studioPoster;img.alt="";img.loading="lazy";box.append(img);return box;
 }
 if(logo && logos[logo]!==undefined){
  const art=document.createElement("div");art.className="emblem";
  art.style.backgroundPosition=(logos[logo]*20)+"% center";box.append(art);return box;
 }
 const names=genericNames[kind]||genericNames.fest;
 const art=document.createElement("div");art.className="generic";
 const top=document.createElement("b");top.textContent=names[0];
 const bottom=document.createElement("span");bottom.textContent=names[1];
 art.append(top,bottom);box.append(art);return box;
}
function render(lang){
 const en=lang==="en";document.documentElement.lang=lang;document.title=(en?"Events":"Мероприятия")+" — TODESPRODUCTION";
 document.querySelector("h1").textContent=en?"Events":"Мероприятия";
 const home=document.getElementById("home");home.href="index.html?lang="+lang;home.textContent=en?"← Home":"← На главную";
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 const area=document.getElementById("schedule");area.replaceChildren();
 const today=dateClock.format(new Date());
 clearTimeout(midnightTimer);
 midnightTimer=setTimeout(()=>render(document.documentElement.lang),Math.max(1000,Date.parse(today+"T00:00:00+03:00")+86400000-Date.now()));
 let currentMonth="",list=null,previousDate="";
 for(const e of events){
  if((e[1]||e[0])<today)continue;
  const month=e[0].slice(0,7);
  if(month!==currentMonth){
   currentMonth=month;previousDate="";
   const section=document.createElement("section");section.className="month";
   const title=document.createElement("h2");title.textContent=textDate(e[0],lang,{month:"long",year:"numeric"});
   list=document.createElement("ul");section.append(title,list);area.append(section);
  }
  const li=document.createElement("li"),when=document.createElement("time");when.dateTime=e[0];
  const dow=dateObj(e[0]).getUTCDay();
  if(dow===0||dow===6)when.className="weekend";
  const first=e[0]!==previousDate;
  when.textContent=first?dateLabel(e,lang):"";
  if(!first)when.setAttribute("aria-label",en?"Same date as above":"Та же дата, что выше");
  previousDate=e[0];
  const details=document.createElement("div"),title=document.createElement("strong");
  title.textContent=en?e[3]:e[2];details.append(title);
  if(e[7]||e[8]){
   const note=document.createElement("small");note.textContent=(en?e[8]:e[7])||"";details.append(note);
  }
  li.append(when,thumbnail(e),details);list.append(li);
 }
 if(!list)area.textContent=en?"New dates will appear here.":"Здесь появятся новые даты.";
}
document.querySelectorAll("[data-lang]").forEach(btn=>btn.onclick=()=>{
 const lang=btn.dataset.lang;history.replaceState(null,"","?lang="+lang);render(lang);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render(document.documentElement.lang)});
window.addEventListener("pageshow",()=>render(document.documentElement.lang));
render(new URLSearchParams(location.search).get("lang")==="en"?"en":"ru");
