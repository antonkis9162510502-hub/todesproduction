<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<meta name="description" content="TODESPRODUCTION — гастрольный график 2026–2027" id="site-description">
<title>Гастроли — TODESPRODUCTION</title>
<style>
:root{color-scheme:dark;--bg:#090b0e;--text:#f1f1ee;--muted:#a4a9ae;--line:#2a2e33;--metal:#bcc5cd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(114,135,158,.11),transparent 48%)}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{width:min(1010px,calc(100% - 44px));margin:auto;position:relative}
header{height:91px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:space-between;gap:16px}
.back{font-size:11px;letter-spacing:.11em;color:#e7ebef;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border:1px solid #59646e;border-radius:999px;background:linear-gradient(145deg,rgba(158,172,185,.2),rgba(31,38,45,.58));box-shadow:inset 0 1px 0 rgba(255,255,255,.13);transition:border-color .2s,background .2s,transform .2s}.back:hover,.back:focus-visible{color:#fff;border-color:#aebbc6;background:linear-gradient(145deg,rgba(176,190,203,.3),rgba(46,56,67,.72))}.back:active{transform:translateY(1px)}
.right{display:flex;align-items:center;gap:15px}.lang{display:flex;gap:3px;align-items:center;padding:3px;border:1px solid #343b42;border-radius:999px;background:rgba(10,13,17,.7)}.lang button{min-width:38px;height:28px;border:0;border-radius:999px;background:transparent;color:#939da7;font-size:11px;font-weight:750}.lang button[aria-pressed=true]{background:linear-gradient(145deg,#e4e8ed,#aab4bd);color:#101419;box-shadow:0 1px 8px rgba(185,205,225,.22)}
.intro{padding:80px 0 52px}.kicker{margin:0 0 19px;color:#aeb9c4;letter-spacing:.27em;font-size:10px;text-transform:uppercase}.intro h1{font-size:clamp(39px,6vw,70px);line-height:1.07;font-weight:600;letter-spacing:-.055em;margin:0 0 22px}.lead{font-size:14px;line-height:1.75;color:#9fa9b1;max-width:660px;margin:0}
.summary{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0 6px}.chip{border:1px solid #34383c;border-radius:100px;padding:9px 15px;font-size:10px;color:#aeb0b1;text-transform:uppercase;letter-spacing:.08em}
.month{padding:34px 0 24px}.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:15px;border-bottom:1px solid #3b424a;padding-bottom:17px;margin-bottom:7px}.month-head h2{font-size:clamp(22px,3vw,30px);font-weight:550;letter-spacing:-.03em;margin:0}.month-head small{font-size:11px;color:#848d96;letter-spacing:.12em;text-transform:uppercase}
.tour-row{display:grid;grid-template-columns:75px 1fr auto;gap:24px;align-items:center;min-height:75px;border-bottom:1px solid rgba(255,255,255,.075);padding:12px 10px}.tour-date{display:flex;align-items:center;gap:10px}.day{font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.05em;font-weight:500;line-height:1}.weekday{font-size:10px;color:#818e99;text-transform:uppercase}.city{font-size:clamp(15px,2vw,18px);font-weight:500;line-height:1.3}.count{font-size:10px;border:1px solid #35414b;border-radius:999px;padding:7px 10px;letter-spacing:.03em;color:#b1c0cb;white-space:nowrap}
.note{padding:37px 0 70px;color:#7e8891;font-size:12px;line-height:1.8}footer{text-align:center;border-top:1px solid #292d31;padding:22px 0 18px;color:#7d848b;font-size:10px;font-weight:300;letter-spacing:.12em}
@media(max-width:600px){header{height:76px}.intro{padding:64px 0 38px}.month{padding:28px 0 20px}.tour-row{grid-template-columns:61px 1fr auto;gap:14px;min-height:71px;padding:12px 1px}.day{font-size:25px}.city{font-size:15px}.count{font-size:9px;padding:6px 7px}.right{gap:8px}.back{font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style>
</head>
<body>
<div class="wrap">
<header>
<a id="home-link" href="index.html" class="back"><span aria-hidden="true">←</span> <span data-t="home">На главную</span></a>
<div class="right"><div class="lang" role="group" aria-label="Выбор языка" id="lang-group"><button type="button" data-lang="ru" aria-pressed="true">RU</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
</header>
<main>
<section class="intro"><p class="kicker">TODESPRODUCTION / 2026–2027</p><h1 data-t="title">Гастрольный график</h1>
<p class="lead" data-t="lead">Предварительное расписание гастролей. Даты и города могут меняться. Следи за обновлениями.</p>
<div class="summary"><span class="chip" data-t="tour">Гастроли</span><span class="chip">2026 / 2027</span></div></section>
<div id="schedule"></div>
<p class="note" data-t="note">Информация носит предварительный характер и обновляется по мере уточнения графика.</p>
</main>
<footer><small>© TODESPRODUCTION 2026</small></footer>
</div>
<script type="application/json" id="schedule-data">[{"date":"2026-11-15","ru":"Улан-Удэ","en":"Ulan-Ude","shows":2},{"date":"2026-11-17","ru":"Чита","en":"Chita","shows":1},{"date":"2026-11-19","ru":"Благовещенск","en":"Blagoveshchensk","shows":1},{"date":"2026-11-20","ru":"Благовещенск","en":"Blagoveshchensk","shows":1},{"date":"2026-11-23","ru":"Хабаровск","en":"Khabarovsk","shows":1},{"date":"2026-11-24","ru":"Хабаровск","en":"Khabarovsk","shows":1},{"date":"2026-11-25","ru":"Комсомольск-на Амуре","en":"Komsomolsk-on-Amur","shows":1},{"date":"2026-11-27","ru":"Владивосток","en":"Vladivostok","shows":1},{"date":"2026-11-28","ru":"Уссурийск","en":"Ussuriysk","shows":1},{"date":"2026-11-29","ru":"Артём","en":"Artyom","shows":1},{"date":"2026-12-01","ru":"Сахалин","en":"Sakhalin","shows":1},{"date":"2026-12-02","ru":"Сахалин","en":"Sakhalin","shows":1},{"date":"2026-12-06","ru":"Гродно","en":"Grodno","shows":1},{"date":"2026-12-07","ru":"Минск","en":"Minsk","shows":1},{"date":"2026-12-08","ru":"Брест","en":"Brest","shows":1},{"date":"2026-12-09","ru":"Барановичи","en":"Baranovichi","shows":1},{"date":"2026-12-11","ru":"Бобруйск","en":"Bobruisk","shows":1},{"date":"2026-12-12","ru":"Могилёв","en":"Mogilev","shows":2},{"date":"2026-12-13","ru":"Речица","en":"Rechitsa","shows":1},{"date":"2026-12-14","ru":"Гомель","en":"Gomel","shows":1},{"date":"2026-12-24","ru":"Краснодар","en":"Krasnodar","shows":1},{"date":"2026-12-25","ru":"Краснодар","en":"Krasnodar","shows":1},{"date":"2026-12-27","ru":"Ростов-на-Дону","en":"Rostov-on-Don","shows":1},{"date":"2026-12-28","ru":"Ростов-на-Дону","en":"Rostov-on-Don","shows":1},{"date":"2026-12-29","ru":"Ростов-на-Дону","en":"Rostov-on-Don","shows":1},{"date":"2027-01-04","ru":"Рязань","en":"Ryazan","shows":1},{"date":"2027-01-06","ru":"Калуга","en":"Kaluga","shows":1},{"date":"2027-01-07","ru":"Смоленск","en":"Smolensk","shows":1},{"date":"2027-01-08","ru":"Брянск","en":"Bryansk","shows":1},{"date":"2027-01-22","ru":"Обнинск","en":"Obninsk","shows":1},{"date":"2027-01-23","ru":"Красногорск","en":"Krasnogorsk","shows":1},{"date":"2027-01-24","ru":"Сергиев Посад","en":"Sergiev Posad","shows":1},{"date":"2027-01-26","ru":"Серпухов","en":"Serpukhov","shows":1},{"date":"2027-01-27","ru":"Подольск","en":"Podolsk","shows":1},{"date":"2027-01-28","ru":"Дубна","en":"Dubna","shows":1},{"date":"2027-01-29","ru":"Орехово-Зуево","en":"Orekhovo-Zuyevo","shows":1},{"date":"2027-01-30","ru":"Зеленоград","en":"Zelenograd","shows":1},{"date":"2027-01-31","ru":"Коломна","en":"Kolomna","shows":1}]</script>
<script>
(()=> {
const events=JSON.parse(document.getElementById('schedule-data').textContent);
const dict={
ru:{home:'На главную',title:'Гастрольный график',lead:'Предварительное расписание гастролей. Даты и города могут меняться. Следи за обновлениями.',tour:'Гастроли',note:'Информация носит предварительный характер и обновляется по мере уточнения графика.',month:{'2026-11':'Ноябрь 2026','2026-12':'Декабрь 2026','2027-01':'Январь 2027'},concerts:'концерта',dates:'даты'},
en:{home:'Home',title:'Tour schedule',lead:'Preliminary tour calendar. Dates and locations may change. Check back for updates.',tour:'Tours',note:'This is a preliminary schedule and is updated as plans are confirmed.',month:{'2026-11':'November 2026','2026-12':'December 2026','2027-01':'January 2027'},concerts:'shows',dates:'dates'}};
const days={ru:['вс','пн','вт','ср','чт','пт','сб'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
const months=[...new Set(events.map(e=>e.date.slice(0,7)))];
function setLang(lang){
 const t=dict[lang]||dict.ru;
 document.documentElement.lang=lang;
 document.title=t.title+' — TODESPRODUCTION';
 document.getElementById('site-description').content='TODESPRODUCTION — '+t.title;
 document.getElementById('home-link').href='index.html?lang='+lang;
 document.getElementById('lang-group').setAttribute('aria-label',lang==='ru'?'Выбор языка':'Choose language');
 document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t]});
 document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));
 const target=document.getElementById('schedule');
 target.replaceChildren();
 for(const month of months){
  const section=document.createElement('section');section.className='month';
  const head=document.createElement('div');head.className='month-head';
  const h=document.createElement('h2');h.textContent=t.month[month]||month;
  const small=document.createElement('small');small.textContent=events.filter(e=>e.date.startsWith(month)).length+' '+t.dates;
  head.append(h,small);section.append(head);
  for(const e of events.filter(e=>e.date.startsWith(month))){
   const row=document.createElement('div');row.className='tour-row';
   const date=document.createElement('div');date.className='tour-date';
   const d=document.createElement('span');d.className='day';d.textContent=String(Number(e.date.slice(-2))).padStart(2,'0');
   const wd=document.createElement('span');wd.className='weekday';wd.textContent=days[lang][new Date(e.date+'T12:00:00Z').getUTCDay()];
   date.append(d,wd);
   const city=document.createElement('span');city.className='city';city.textContent=lang==='ru'?e.ru:e.en;
   const indicator=document.createElement('span');
   if(e.shows>1){indicator.className='count';indicator.textContent=e.shows+' '+t.concerts;}
   row.append(date,city,indicator);section.append(row);
  }
  target.append(section);
 }
}
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
setLang(new URLSearchParams(location.search).get('lang')==='en'?'en':'ru');
})();
</script>
</body></html>
