<title>TODESPRODUCTION</title>
<style>
    :root { color-scheme: dark; --bg:#090b0e; --panel:#11151a; --line:#2a2e33; --text:#f1f1ee; --muted:#a4a9ae; --accent:#bcc5cd; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    body::before { position:absolute; content:""; inset:0 0 auto; height:760px; pointer-events:none; background:radial-gradient(ellipse at 50% 22%,rgba(127,147,165,.12),transparent 53%),radial-gradient(ellipse at 86% 12%,rgba(79,97,126,.06),transparent 38%); }
    a { color:inherit; text-decoration:none; }
    button, input, textarea { font:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .wrap { width:min(1180px,calc(100% - 48px)); margin:0 auto; }
    .header { position:relative; z-index:2; display:flex; justify-content:flex-end; align-items:center; padding:25px 0; border-bottom:1px solid rgba(255,255,255,.09); gap:16px; }
    .brand { display:flex; align-items:center; gap:12px; font-size:12px; font-weight:800; letter-spacing:.19em; }
    .brand-mark { width:32px; height:32px; border:1px solid #656565; display:grid; place-items:center; color:#eee7de; font-size:13px; font-weight:800; letter-spacing:-.14em; padding-right:3px; }
    .header-right { display:flex; align-items:center; gap:30px; }
    .availability { color:#a7acb0; text-transform:uppercase; letter-spacing:.15em; font-size:10px; white-space:nowrap; }
    .availability::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:10px; vertical-align:2px; box-shadow:0 0 14px rgba(207,176,131,.3); }
    .header-link { font-size:12px; color:#f0e9de; border-bottom:1px solid #696057; padding-bottom:5px; }
    .hero { position:relative; text-align:center; min-height:720px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:62px 0 82px; }
    .eyebrow { font-weight:700; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); }
    .hero-photo-wrap { margin:36px auto 14px; width:min(980px,100%); position:relative; }
    .hero-photo-wrap::before { content:""; position:absolute; inset:-45px -25px; z-index:0; background:radial-gradient(ellipse at center,rgba(177,188,198,.10),transparent 65%); filter:blur(18px); }
    .hero-photo { display:block; position:relative; width:100%; height:auto; object-fit:contain; filter:drop-shadow(0 16px 20px rgba(0,0,0,.38)); }
    .hero h1 { font-size:clamp(35px,5.2vw,67px); letter-spacing:-.055em; line-height:1.07; font-weight:650; margin:26px 0 16px; max-width:900px; }
    .hero-lead { font-size:clamp(15px,1.6vw,19px); line-height:1.75; max-width:670px; color:#b1b5b8; margin:0; }
    .pills { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:25px; }
    .pill { border:1px solid #34383c; color:#aeb0b1; border-radius:100px; padding:9px 14px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
    .hero-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:11px; margin-top:33px; }
    .btn { display:inline-flex; justify-content:center; align-items:center; min-height:49px; padding:0 23px; border:1px solid transparent; font-weight:650; font-size:13px; border-radius:3px; transition:transform .2s ease, background .2s ease; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:#e9e7e2; color:#0b0d0e; }
    .btn-primary:hover { background:#fff; }
    .btn-secondary { background:transparent; color:#c8c9c9; border-color:#474b4d; }
    .btn-secondary:hover { background:#171b1f; }
    .divider { height:1px; background:linear-gradient(90deg,transparent,#35393c 17%,#35393c 83%,transparent); }
    .contact { display:grid; grid-template-columns:1fr 1.1fr; gap:clamp(30px,7vw,115px); padding:94px 0 102px; align-items:start; }
    .section-kicker { margin:0 0 18px; font-size:11px; font-weight:750; letter-spacing:.24em; color:var(--accent); }
    .contact h2 { font-size:clamp(35px,3.8vw,52px); line-height:1.11; letter-spacing:-.045em; font-weight:620; margin:0 0 24px; }
    .contact-copy { color:var(--muted); line-height:1.75; font-size:15px; max-width:435px; margin:0; }
    .direct { margin-top:37px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .direct dt { font-size:10px; color:#8d9297; text-transform:uppercase; letter-spacing:.15em; margin-bottom:10px; }
    .direct dd { margin:0; font-size:13px; color:#cfced0; line-height:1.55; }
    .contact-card { background:linear-gradient(135deg,#171a1e,#101317); border:1px solid #30343a; padding:clamp(24px,4vw,37px); border-radius:5px; box-shadow:0 24px 80px rgba(0,0,0,.14); }
    .contact-card h3 { margin:0 0 24px; font-size:20px; letter-spacing:-.02em; font-weight:620; }
    .field { display:block; margin:16px 0; }
    .field span { display:block; font-size:12px; margin:0 0 9px; color:#c7c9ca; }
    .field input, .field textarea { width:100%; background:#0d1013; color:#f4f4f4; border:1px solid #3d4145; border-radius:3px; outline:0; padding:14px 14px; font-size:14px; transition:border-color .15s; }
    .field input:focus, .field textarea:focus { border-color:#b5a185; }
    .field input::placeholder,.field textarea::placeholder { color:#6f757a; }
    .field textarea { resize:vertical; min-height:116px; line-height:1.5; }
    .send-btn { width:100%; margin-top:8px; }
    .demo-note { color:#90969a; line-height:1.55; font-size:11px; margin:15px 0 0; }
    .form-status { font-size:12px; line-height:1.6; color:#ddceb8; margin:18px 0 0; display:none; }
    .form-status.show { display:block; }
    .draft { margin-top:12px; display:none; width:100%; min-height:150px; padding:10px; color:white; background:#080a0c; border:1px solid #4c535b; }
    .draft.show { display:block; }
    .footer { display:flex; justify-content:center; align-items:center; text-align:center; border-top:1px solid #292d31; padding:22px 0 18px; color:#7d848b; font-size:10px; font-weight:300; letter-spacing:.12em; }
    @media (max-width:760px) { .wrap{width:min(100% - 36px,600px)} .header{padding:18px 0} .availability{display:none} .brand{font-size:10px;letter-spacing:.12em}.header-right{gap:10px} .hero{min-height:0;padding:86px 0 87px}.eyebrow{font-size:9px;line-height:1.7}.hero-photo-wrap{margin:25px auto 3px}.hero h1{margin-top:25px}.hero-lead{line-height:1.65}.pills{margin-top:21px}.pill{font-size:10px;padding:8px 11px}.contact{grid-template-columns:1fr;padding:76px 0 84px}.direct{margin-top:26px}.contact-card{padding:24px}.footer{padding-bottom:25px} }
    @media (max-width:440px) { .hero-actions{width:100%}.hero-actions .btn{width:100%}.direct{grid-template-columns:1fr}.hero h1{font-size:39px}.brand-mark{width:28px;height:28px}.brand{font-size:9px} }
    @media (prefers-reduced-motion:reduce) {html{scroll-behavior:auto}.btn{transition:none}}
  
    /* Dedicated metallic wordmark; no photographic background */
    @media (max-width:760px) { .hero-photo-wrap { width:min(100%,620px); margin:33px auto 13px; } .hero-photo { filter:drop-shadow(0 12px 12px rgba(0,0,0,.34)); } .eyebrow { letter-spacing:.13em; max-width:100%; } }
    body { overflow-x:hidden; }
    /* iOS-friendly metallic reflection: reveal a brighter duplicate of the
       transparent logo with a moving polygon, no animated CSS masks required. */
    .hero-photo-shine {
      position:absolute;
      inset:0;
      z-index:1;
      display:block;
      width:100%;
      height:auto;
      pointer-events:none;
      opacity:0;
      filter:brightness(3) contrast(1.15) drop-shadow(0 0 9px rgba(216,236,255,.5));
      -webkit-clip-path:polygon(-25% 0,-12% 0,8% 100%,-5% 100%);
      clip-path:polygon(-25% 0,-12% 0,8% 100%,-5% 100%);
      animation:metal-shine-sweep 5s linear infinite;
      will-change:clip-path,opacity;
    }
    @keyframes metal-shine-sweep {
      0%,6% { opacity:0; -webkit-clip-path:polygon(-25% 0,-12% 0,8% 100%,-5% 100%); clip-path:polygon(-25% 0,-12% 0,8% 100%,-5% 100%); }
      12% { opacity:1; }
      46% { opacity:1; -webkit-clip-path:polygon(100% 0,113% 0,133% 100%,120% 100%); clip-path:polygon(100% 0,113% 0,133% 100%,120% 100%); }
      52%,100% { opacity:0; -webkit-clip-path:polygon(100% 0,113% 0,133% 100%,120% 100%); clip-path:polygon(100% 0,113% 0,133% 100%,120% 100%); }
    }
    /* The small TODESPRODUCTION wordmark also receives a fine silver highlight. */
    .brand > span:last-child {
      color:#eee;
      background:linear-gradient(100deg,#e3e3e0 34%,#fff 45%,#94a0a8 51%,#fff 55%,#d6d8d9 65%);
      background-size:260% 100%;
      background-position:100% 50%;
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:brand-metal-shine 6.3s ease-in-out infinite;
    }
    @keyframes brand-metal-shine {
      0%,8% { background-position:100% 50%; }
      49%,100% { background-position:0% 50%; }
    }
    @media (max-width:760px) {
      .hero-photo-shine { filter:brightness(3.3) contrast(1.14) drop-shadow(0 0 12px rgba(232,242,255,.65)); }
    }
    @media (prefers-reduced-motion:reduce) {
      .hero-photo-shine,.brand > span:last-child { animation:none; }
      .hero-photo-shine { display:none; }
      .brand > span:last-child { background:none; -webkit-text-fill-color:currentColor; }
    }


    /* Minimal home layout. Keep metallic animation; move categories lower. */
    .hero { min-height:calc(100svh - 150px); gap:2px; padding:38px 0 64px; }
    .hero-photo-wrap { margin:0 auto; width:min(980px,100%); }
    .pills { margin-top:clamp(78px, 12vh, 132px); }
    .footer a { border-bottom:1px solid #454b52; padding-bottom:3px; color:#bec2c6; }
    .footer a:hover, .header-link:hover { color:#fff; }
    /* Language selector: top-right, discreet metallic styling */
    .header-right { gap:18px; }
    .language-switch { display:inline-flex; gap:3px; align-items:center; padding:3px; border:1px solid #343b42; border-radius:999px; background:rgba(10,13,17,.7); }
    .language-switch button { min-width:38px; height:28px; padding:0 8px; border:0; border-radius:999px; background:transparent; color:#939da7; font-size:11px; font-weight:750; letter-spacing:.07em; transition:background .2s,color .2s; }
    .language-switch button[aria-pressed="true"] { background:linear-gradient(145deg,#e4e8ed,#aab4bd); color:#101419; box-shadow:0 1px 8px rgba(185,205,225,.22); }
    .language-switch button:hover:not([aria-pressed="true"]) { color:#fff; background:rgba(255,255,255,.09); }
    @media(max-width:440px) { .header-right { gap:12px; } .language-switch button { min-width:35px; height:26px; } }
    @media(max-width:760px) {
      .hero { min-height:calc(100svh - 145px); padding:34px 0 55px; }
      .hero-photo-wrap { margin:0 auto; width:min(100%,620px); }
      .pills { margin-top:64px; }
    }
    @media(max-width:440px) {
      .footer { flex-direction:column; align-items:center; text-align:center; gap:18px; }
      .hero { min-height:calc(100svh - 160px); }
      .pill { padding:8px 10px; font-size:10px; }
    }

    /* Contact form modal: responsive and accessible */
    .header-link { background:transparent; cursor:pointer; }
    /* Match the oval category pills while retaining the contact dialog behavior. */
    .header-link.contact-open {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:9px 14px;
      border:1px solid #34383c;
      border-radius:100px;
      background:transparent;
      color:#aeb0b1;
      font-size:11px;
      line-height:1.2;
      font-weight:400;
      letter-spacing:.1em;
      text-transform:uppercase;
      white-space:nowrap;
      transition:border-color .2s ease,color .2s ease,background .2s ease;
    }
    .header-link.contact-open:hover {
      border-color:#626c75;
      color:#f1f3f4;
      background:rgba(255,255,255,.045);
    }
    @media (max-width:440px) {
      .header-link.contact-open { padding:8px 10px; font-size:10px; }
    }
        .contact-dialog { position:fixed; width:min(510px,calc(100% - 28px)); max-height:calc(100dvh - 28px); overflow-y:auto; margin:auto; padding:0; border:1px solid #444b54; border-radius:9px; background:#14181d; color:#f1f1ee; box-shadow:0 30px 100px rgba(0,0,0,.6); }
    .contact-dialog::backdrop { background:rgba(0,0,0,.78); backdrop-filter:blur(5px); }
    .contact-dialog-inner { position:relative; padding:clamp(23px,5vw,40px); }
    .contact-dialog-kicker { margin:0 45px 12px 0; color:#aab6c0; letter-spacing:.17em; font-size:11px; font-weight:700; }
    .contact-dialog h2 { margin:0 35px 9px 0; font-size:clamp(28px,6vw,38px); line-height:1.12; }
    .contact-dialog-lead { margin:0 0 20px; font-size:13px; line-height:1.65; color:#aab0b6; }
    .contact-close { position:absolute; right:19px; top:18px; display:grid; place-items:center; width:36px; height:36px; background:transparent; color:#d3d7dc; border:1px solid #424a52; border-radius:50%; font-size:26px; line-height:1; cursor:pointer; }
    .contact-close:hover { background:#28313a; }
    .contact-dialog .field { margin:14px 0; }
    .contact-dialog .field input,.contact-dialog .field textarea { background:#0b0e11; border-color:#454c53; }
    .contact-dialog .field textarea { min-height:115px; }
    .contact-dialog .send-btn { width:100%; margin-top:8px; }
    .contact-dialog .send-btn:disabled { opacity:.6; cursor:wait; }
    .contact-dialog .contact-status { color:#cbd6e0; line-height:1.55; font-size:13px; margin:12px 0 0; }
    .contact-dialog .contact-status:empty { display:none; }
    .contact-dialog .contact-note { margin:15px 0 0; font-size:11px; color:#939aa2; line-height:1.6; }
    .bot-field { position:absolute !important; width:1px; height:1px; opacity:0; left:-9999px; overflow:hidden; pointer-events:none; }
    @media (max-width:440px) { .contact-dialog-inner { padding:23px; } }
.pill[href]{display:inline-flex;align-items:center;transition:border-color .2s,color .2s}.pill[href]:hover{border-color:#697783;color:#f1f3f4}

</style>

        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = strings[el.dataset.i18n]; });
        document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', strings[el.dataset.i18nAria]); });
        document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.setAttribute('alt', strings[el.dataset.i18nAlt]); });
        document.querySelector('#site-description').setAttribute('content', strings.description);
        document.getElementById('theatre-link').href = 'theatre.html?lang=' + lang;
        document.getElementById('events-link').href = 'events.html?lang=' + lang;
        document.getElementById('tours-link').href = 'tours.html?lang=' + lang;
        document.querySelectorAll('.language-switch button[data-lang]').forEach(el => {
          el.setAttribute('aria-pressed', String(el.dataset.lang === lang));
        });
      }
      document.querySelectorAll('.language-switch button[data-lang]').forEach(el => {
        el.addEventListener('click', () => setLanguage(el.dataset.lang));
      });
      setLanguage(new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ru');
    })();


    // Open the modal from the navigation/footer; use native Escape and focus handling.
    (() => {
      const modal = document.getElementById('contact-dialog');
      const form = document.getElementById('contact-form');
      const status = document.getElementById('contact-status');
      const submit = form.querySelector('[type="submit"]');
      const messages = {
        ru: {sending:'Отправляем…', sent:'Спасибо! Сообщение отправлено.', error:'Не удалось отправить сообщение. Попробуй ещё раз чуть позже.'},
        en: {sending:'Sending…', sent:'Thank you! Your message has been sent.', error:'We could not send your message. Please try again later.'}
      };
      const getMessages = () => messages[document.documentElement.lang] || messages.ru;
      document.querySelectorAll('.contact-open').forEach(button => {
        button.addEventListener('click', () => {
          status.textContent = '';
          if (!modal.open) modal.showModal();
          form.querySelector('[name="name"]').focus();
        });
      });
      document.getElementById('contact-close').addEventListener('click', () => modal.close());
      modal.addEventListener('click', event => { if (event.target === modal) modal.close(); });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!form.reportValidity() || submit.disabled) return;
        status.textContent = getMessages().sending;
        submit.disabled = true;
        try {
          const response = await fetch('/', {
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams(new FormData(form)).toString()
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          status.textContent = getMessages().sent;
          form.reset();
        } catch (error) {
          status.textContent = getMessages().error;
        } finally {
          submit.disabled = false;
        }
      });
    })();

    // Duplicate the original transparent logo without downloading a second asset.
    // The highlight stays limited to the letters, even in iOS Safari.
    (() => {
      const logo = document.querySelector('.hero-photo-wrap .hero-photo');
      if (!logo || document.querySelector('.hero-photo-shine')) return;
      const shine = logo.cloneNode(false);
      shine.classList.add('hero-photo-shine');
      shine.setAttribute('aria-hidden','true');
      shine.alt = '';
      logo.insertAdjacentElement('afterend', shine);

      // iOS Chrome and Safari can fail to interpolate animated polygon clip-path.
      // Keep the existing CSS animation on Android/desktop, and drive the
      // same moving metallic highlight explicitly on iOS.
      const isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;

      shine.style.animation = 'none';
      shine.style.webkitAnimation = 'none';
      // The owner requested this branded animation even when the iPhone
      // reports reduced motion; this overrides only the logo's hidden state.
      shine.style.display = 'block';
      shine.style.opacity = '0';
      const duration = 5200;
      const started = performance.now();
      let lastPaint = -Infinity;

      function drawMetalHighlight(time) {
        if (time - lastPaint >= 33) {
          lastPaint = time;
          const progress = ((time - started) % duration) / duration;
          if (progress < 0.10 || progress > 0.52) {
            shine.style.opacity = '0';
          } else {
            const travel = (progress - 0.10) / 0.42;
            const left = -30 + 142 * travel;
            const polygon = 'polygon(' +
              left.toFixed(2) + '% 0%,' +
              (left + 16).toFixed(2) + '% 0%,' +
              (left + 36).toFixed(2) + '% 100%,' +
              (left + 20).toFixed(2) + '% 100%)';
            shine.style.webkitClipPath = polygon;
            shine.style.clipPath = polygon;
            shine.style.opacity = String(Math.max(0, Math.min(1,
              (progress - 0.10) / 0.035, (0.52 - progress) / 0.035)));
          }
        }
        requestAnimationFrame(drawMetalHighlight);
      }
      requestAnimationFrame(drawMetalHighlight);
    })();
  </script>
</body>
